services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - track-backend

  track-backend:
    image: node:22-alpine
    container_name: track-backend
    working_dir: /app
    command: node index.js
    environment:
      HOST: 0.0.0.0
      PORT: 18080
      TRACK_STORE_PATH: /app/data/tracks.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173}
    ports:
      - "18080:18080"
    volumes:
      - ./backend_scraper:/app

volumes:
  node_modules:
